name: iOS Verify

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Generate, build, and test
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: Report Xcode and Swift versions
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version

      - name: Install XcodeGen 2.46.0
        shell: bash
        env:
          XCODEGEN_VERSION: "2.46.0"
          XCODEGEN_SHA256: "4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806"
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/xcodegen.zip"
          install_root="$RUNNER_TEMP/xcodegen-release"
          xcodegen_bin="$install_root/xcodegen/bin/xcodegen"
          curl --fail --location --silent --show-error \
            "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" \
            --output "$archive"
          echo "${XCODEGEN_SHA256}  ${archive}" | shasum -a 256 --check
          mkdir -p "$install_root"
          unzip -q "$archive" -d "$install_root"
          chmod +x "$xcodegen_bin"
          echo "$(dirname "$xcodegen_bin")" >> "$GITHUB_PATH"
          "$xcodegen_bin" --version

      - name: Generate Xcode project
        id: generate
        working-directory: ios
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project.yml
          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Verify committed generated project parity
        shell: bash
        run: |
          set -euo pipefail
          git ls-files --error-unmatch ios/RocketFlow.xcodeproj/project.pbxproj >/dev/null
          git diff --exit-code -- ios/RocketFlow.xcodeproj

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project ios/RocketFlow.xcodeproj \
            -scheme RocketFlow-CI \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages"

      - name: Verify resolved package lock parity
        shell: bash
        run: |
          set -euo pipefail
          lockfile="ios/RocketFlow.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved"
          if ! git ls-files --error-unmatch "$lockfile" >/dev/null; then
            echo "::error file=${lockfile}::Package.resolved must be tracked before CI can verify dependency parity."
            exit 1
          fi
          if ! git diff --quiet -- "$lockfile"; then
            echo "::error file=${lockfile}::Swift package resolution changed Package.resolved. Commit the resolved lockfile from the generated-project artifact."
            git diff -- "$lockfile"
            exit 1
          fi

      - name: Select iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          candidates = [
              device
              for runtime_devices in devices.values()
              for device in runtime_devices
              if device.get("isAvailable") and device.get("name", "").startswith("iPhone")
          ]
          if not candidates:
              raise SystemExit("No available iPhone simulator found")
          print(candidates[0]["udid"])
          ')"
          echo "ROCKETFLOW_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"

      - name: Build and test without signing
        run: |
          set -o pipefail
          result_bundle="$RUNNER_TEMP/RocketFlow.xcresult"
          if [[ -z "$RUNNER_TEMP" || "$result_bundle" != "$RUNNER_TEMP/"* ]]; then
            echo "::error::Refusing to clean an XCTest result path outside RUNNER_TEMP."
            exit 1
          fi
          rm -rf -- "$result_bundle"
          xcodebuild test \
            -project ios/RocketFlow.xcodeproj \
            -scheme RocketFlow-CI \
            -destination "platform=iOS Simulator,id=${ROCKETFLOW_SIMULATOR_ID}" \
            -derivedDataPath "$RUNNER_TEMP/RocketFlowDerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -resultBundlePath "$result_bundle" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Check test result bundle
        id: xcresult
        if: ${{ always() }}
        shell: bash
        run: |
          if [[ -d "$RUNNER_TEMP/RocketFlow.xcresult" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload test result bundle
        if: ${{ always() && steps.xcresult.outputs.exists == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: RocketFlow-xcresult
          path: ${{ runner.temp }}/RocketFlow.xcresult
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated Xcode project
        if: ${{ always() && steps.generate.outputs.generated == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: RocketFlow-xcodeproj-xcodegen-2.46.0
          path: ios/RocketFlow.xcodeproj
          if-no-files-found: error
          retention-days: 14
